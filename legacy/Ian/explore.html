<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · 探索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="explore">
  <div class="app">
    <div id="sidebar-slot"></div>

    <main>
      <div id="topbar-slot"></div>

      <section class="page active" id="explorePage">
        <p class="eyebrow">OOTD Community</p>
        <h1>探索</h1>
        <p class="intro">看看衣友今天怎麼穿，也找到下一套靈感。</p>
        <div class="explore-toolbar"><label class="explore-search"><span>⌕</span><input id="exploreSearch" type="search" placeholder="搜尋穿搭、風格、使用者" aria-label="搜尋穿搭、風格、使用者"></label><div class="feed-tabs"><button class="feed-tab active" data-feed="for-you">為你推薦</button><button class="feed-tab" data-feed="following">追蹤中</button></div></div>
        <div class="ootd-grid" id="ootdGrid"></div>
      </section>
    </main>
  </div>

  <div id="bottom-nav-slot"></div>

  <div class="modal-backdrop" id="ootdBackdrop">
    <section class="modal ootd-form-modal">
      <button class="modal-close" id="closeOotdForm" aria-label="關閉">×</button>
      <p class="eyebrow">分享今天的穿搭</p>
      <h2>發布 OOTD</h2>
      <form id="ootdForm">
        <div class="form-field"><label for="ootdPhotoFile">穿搭照片</label><label class="ootd-upload" for="ootdPhotoFile"><strong>上傳你的 OOTD</strong><span>選一張最能代表今天的照片</span><input id="ootdPhotoFile" type="file" accept="image/jpeg,image/png,image/webp"><img class="ootd-upload-preview" id="ootdPreview" alt="OOTD 預覽"></label><input id="ootdPhoto" type="hidden"></div>
        <div class="form-field" style="margin-top:16px"><label for="ootdCaption">Caption</label><textarea id="ootdCaption" required placeholder="今天這套穿搭，想和衣友分享什麼？"></textarea></div>
        <div class="form-field" style="margin-top:16px"><label for="ootdHashtags">Hashtags</label><input id="ootdHashtags" placeholder="#minimal #dailylook"></div>
        <div class="form-field" style="margin-top:16px"><label>標註衣櫥單品</label><div class="tag-items" id="ootdTagItems"></div></div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelOotdForm">取消</button><button type="submit" class="primary">發布穿搭</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop" id="commentBackdrop"><section class="modal comment-modal"><button class="modal-close" id="closeComments" aria-label="關閉">×</button><p class="eyebrow">OOTD Community</p><h2>留言</h2><div class="comment-list" id="commentList"></div><form class="comment-form" id="commentForm"><input id="commentInput" required placeholder="寫下你的想法"><button class="primary" type="submit">送出</button></form></section></div>
  <div id="notification-modal-slot"></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>renderExplore();</script>
</body>
</html>
