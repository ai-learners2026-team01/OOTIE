<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · 穿搭求救</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="sos">
  <div class="app">
    <div id="sidebar-slot"></div>

    <main>
      <div id="topbar-slot"></div>

      <section class="page active" id="sosPage">
        <p class="eyebrow">Style SOS</p>
        <h1>穿搭求救</h1>
        <p class="intro">衣友正在求救，從她真正擁有的衣櫥裡幫她搭一套。</p>
        <div class="sos-toolbar"><label class="sos-search"><span>⌕</span><input id="sosSearch" type="search" placeholder="搜尋場合或穿搭需求" aria-label="搜尋場合或穿搭需求"></label><button class="primary" id="openSosForm">＋ 發布求救</button></div>
        <div class="sos-tabs" role="tablist" aria-label="穿搭求救分類"><button class="sos-tab active" id="sosReceivedTab" type="button" role="tab" aria-selected="true">衣友求救板</button><button class="sos-tab" id="sosSentTab" type="button" role="tab" aria-selected="false">我發出的求救</button></div>
        <div class="sos-feed" id="sosFeed"></div>
      </section>
    </main>
  </div>

  <div id="bottom-nav-slot"></div>

  <div class="modal-backdrop" id="sosFormBackdrop">
    <section class="modal sos-form-modal">
      <button class="modal-close" id="closeSosForm" aria-label="關閉">×</button>
      <p class="eyebrow">Style SOS</p>
      <h2>請衣友幫忙搭配</h2>
      <form id="sosForm">
        <div class="form-field"><label for="sosTitle">標題</label><input id="sosTitle" required placeholder="例如：明天第一次約會，我該穿什麼？"></div>
        <div class="form-field" style="margin-top:16px"><label for="sosDetails">告訴衣友更多</label><textarea id="sosDetails" required placeholder="描述你的行程、期待的感覺或穿搭困擾"></textarea></div>
        <div class="form-grid" style="margin-top:16px"><div class="form-field"><label for="sosOccasion">場合</label><select id="sosOccasion"><option>約會</option><option>工作</option><option>上課</option><option>聚餐</option><option>戶外活動</option><option>旅行</option></select></div><div class="form-field"><label for="sosWeather">預期天氣</label><select id="sosWeather"><option>晴天</option><option>涼爽</option><option>炎熱</option><option>下雨</option><option>微涼有風</option></select></div><div class="form-field"><label for="sosWhen">穿著時機</label><select id="sosWhen"><option>今晚</option><option>明天</option><option>週末</option><option>下週</option></select></div></div>
        <div class="form-field" style="margin-top:16px"><label>想呈現的風格</label><div class="vibe-options"><label class="vibe-option"><input type="checkbox" value="Soft">柔和</label><label class="vibe-option"><input type="checkbox" value="Elegant">優雅</label><label class="vibe-option"><input type="checkbox" value="Smart Casual">俐落休閒</label><label class="vibe-option"><input type="checkbox" value="Relaxed">放鬆</label><label class="vibe-option"><input type="checkbox" value="Confident">自信</label><label class="vibe-option"><input type="checkbox" value="Playful">活潑</label></div></div>
        <div class="form-field" style="margin-top:16px"><label>本次公開給衣友的衣物</label><p class="sos-share-help">只有你勾選的衣物會出現在這筆求救中，其他衣櫥內容不會公開。衣友只能使用你本次公開的衣物幫你搭配。</p><div class="suggestion-items sos-share-items" id="sosShareItems"></div><p class="suggestion-selected" id="sosShareSelected">已選 0 件</p><p class="sos-share-validation">請至少選擇 1 件要公開給衣友的衣物。</p></div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelSosForm">取消</button><button type="submit" class="primary">發布求救</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop" id="suggestionBackdrop">
    <section class="modal suggestion-form-modal">
      <button class="modal-close" id="closeSuggestion" aria-label="關閉">×</button>
      <p class="eyebrow">Style SOS</p>
      <h2>幫她搭一套</h2>
      <p class="suggestion-intro" id="suggestionIntro">從她的衣櫥挑幾件單品，分享你的搭配想法。</p>
      <form id="suggestionForm">
        <div class="form-field"><label>選擇單品</label><div class="suggestion-items" id="suggestionItems"></div><p class="suggestion-selected" id="suggestionSelected">已選 0 件</p><div class="current-outfit" id="currentOutfit"><div class="current-outfit-title">目前搭配</div><div class="current-outfit-images" id="currentOutfitImages"></div><p class="current-outfit-names" id="currentOutfitNames"></p></div></div>
        <div class="form-field" style="margin-top:18px"><label for="suggestionMessage">給她的搭配建議</label><textarea id="suggestionMessage" required placeholder="說說你為什麼這樣搭，或提醒她一些小細節"></textarea></div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelSuggestion">取消</button><button type="submit" class="primary">送出建議</button></div>
      </form>
    </section>
  </div>
  <div class="modal-backdrop" id="sosDetailBackdrop">
    <section class="modal sos-detail-modal">
      <button class="modal-close" id="closeSosDetail" aria-label="關閉">×</button>
      <div id="sosDetailContent"></div>
    </section>
  </div>
  <div class="modal-backdrop" id="sosClosetGalleryBackdrop">
    <section class="modal sos-closet-gallery-modal">
      <button class="modal-close" id="closeSosClosetGallery" aria-label="關閉">×</button>
      <div id="sosClosetGalleryContent"></div>
    </section>
  </div>
  <div class="modal-backdrop" id="closeSosConfirmBackdrop">
    <section class="modal sos-close-confirm-modal">
      <button class="modal-close" id="closeSosConfirm" aria-label="關閉">×</button>
      <p class="eyebrow">Style SOS</p>
      <h2>結束這次求救？</h2>
      <p>結束後將不再接受新的搭配建議，但你仍可以查看目前收到的所有回覆。</p>
      <div class="form-actions"><button type="button" class="secondary" id="cancelCloseSos">取消</button><button type="button" class="primary" id="confirmCloseSos">確認結束</button></div>
    </section>
  </div>
  <div class="modal-backdrop" id="authFormBackdrop">
    <section class="modal auth-form-modal" style="padding:34px; max-width:440px;">
      <button class="modal-close" id="closeAuthForm" aria-label="關閉">×</button>
      <p class="eyebrow">Supabase Auth</p>
      <h2 style="font-family:'Playfair Display',serif; font-size:28px; margin-bottom:16px;">帳號登入</h2>
      <form id="authForm">
        <div class="form-field"><label for="authEmail">Email</label><input id="authEmail" type="email" required placeholder="user@example.com"></div>
        <div class="form-field" style="margin-top:16px"><label for="authPassword">密碼</label><input id="authPassword" type="password" required placeholder="••••••••"></div>
        <p class="auth-error" id="authError" style="color:#a65f5b; font-size:12px; margin-top:10px; display:none;"></p>
        <div class="form-actions" style="margin-top:20px"><button type="button" class="secondary" id="cancelAuthForm">取消</button><button type="submit" class="primary">登入</button></div>
      </form>
    </section>
  </div>
  <div id="notification-modal-slot"></div>
  <div class="toast" id="toast"></div>

  <script src="supabase-config.local.js"></script>
  <script src="fixture-data.local.js"></script>
  <script src="supabase-adapter.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>renderSosFeed();</script>
</body>
</html>
