<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · 首頁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div class="app">
    <div id="sidebar-slot"></div>

    <main>
      <div id="topbar-slot"></div>

      <section class="page active" id="homePage">
        <div class="page-brand">OOTie</div>
        <h1>今天想穿什麼？</h1>
        <p class="intro">今天想穿什麼？</p>
        <div class="occasion-row" id="occasionRow"></div>
        <div class="recommendation"><div class="weather-status" id="weatherStatus"><span class="weather-icon" aria-hidden="true">☁</span><span>正在取得天氣…</span></div><div><p class="eyebrow">OOTie 為你挑了一套</p><h3 id="recommendationTitle">週末的輕鬆日常</h3><p id="recommendationCopy">柔軟、舒服，也保留一點俐落感。</p></div><div class="outfit-mini" id="outfitMini"></div><button type="button" class="reroll-recommendation" id="rerollRecommendation">↻ 重新搭配</button></div>
        <div class="home-columns">
          <section><div class="section-heading"><h2>Style SOS</h2><a class="text-link" href="sos.html">查看更多 →</a></div><div class="sos-list"><a class="sos-card" href="sos.html"><strong>第一次約會，要怎麼穿？</strong><span>Soft · Elegant　32 件衣服可選</span></a><a class="sos-card" href="sos.html"><strong>面試新創公司，西裝會不會太正式？</strong><span>Smart Casual · 明天</span></a></div></section>
          <section><div class="section-heading"><h2>OOTD Inspiration</h2><a class="text-link" href="explore.html">探索更多 →</a></div><div class="inspiration-grid"><figure class="inspiration-card" data-home-post="post-01" tabindex="0" role="button"><img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=85" alt="城市穿搭靈感"><figcaption>@minji · #everydaystyle</figcaption></figure><figure class="inspiration-card" data-home-post="post-02" tabindex="0" role="button"><img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=700&q=85" alt="簡約穿搭靈感"><figcaption>@sofia · #minimal</figcaption></figure><figure class="inspiration-card" data-home-post="post-03" tabindex="0" role="button"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=700&q=85" alt="週末穿搭靈感"><figcaption>@nora · #weekend</figcaption></figure></div></section>
        </div>
      </section>
    </main>
  </div>

  <div id="bottom-nav-slot"></div>

  <div class="modal-backdrop" id="detailBackdrop">
    <article class="modal detail-layout" id="detailModal"></article>
  </div>
  <div class="modal-backdrop" id="commentBackdrop"><section class="modal instagram-post-modal"><button class="modal-close" id="closeComments" aria-label="關閉">×</button><div class="instagram-post-visual"><img id="commentPostImage" src="" alt="OOTD 預覽"></div><div class="instagram-post-panel"><div class="comment-post-header" id="commentPostHeader"></div><div class="comment-post-caption" id="commentPostCaption"></div><div class="comment-post-meta" id="commentPostMeta"></div><div class="comment-post-actions" id="commentPostActions"></div><div class="comment-list" id="commentList"></div><form class="comment-form" id="commentForm"><input id="commentInput" required placeholder="寫下你的想法"><button class="primary" type="submit">送出</button></form></div></section></div>
  <div class="modal-backdrop" id="formBackdrop">
    <section class="modal form-modal">
      <button class="modal-close" id="closeForm" aria-label="關閉">×</button>
      <p class="eyebrow" id="formEyebrow">新增單品</p>
      <h2 id="formTitle">加入衣櫥</h2>
      <form id="itemForm">
        <div class="form-field full"><label for="photoFile">上傳單品照片</label><label class="upload-zone" for="photoFile"><strong>選擇一張單品照片</strong><span>建議使用單件衣物照片，支援 JPG、PNG、WEBP</span><input id="photoFile" name="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><img class="upload-preview" id="uploadPreview" alt="照片預覽"></label><input id="photo" name="photo" type="hidden"></div>
        <div class="form-grid">
          <div class="form-field"><label for="name">單品名稱</label><input id="name" name="name" required placeholder="例如：亞麻襯衫"></div>
          <div class="form-field"><label for="category">分類</label><select id="category" name="category"><option value="Tops">上衣</option><option value="Bottoms">下身</option><option value="Dress">洋裝</option><option value="Outerwear">外套</option><option value="Shoes">鞋履</option><option value="Bags">包款</option><option value="Accessories">配件</option></select></div>
          <div class="form-field"><label for="brand">品牌</label><input id="brand" name="brand" placeholder="選填"></div>
          <div class="form-field"><label for="primary_color">主要顏色</label><input id="primary_color" name="primary_color" required placeholder="例如：White"></div>
          <div class="form-field"><label for="secondary_color">次要顏色</label><input id="secondary_color" name="secondary_color" placeholder="選填，例如：Beige"></div>
          <div class="form-field"><label for="shape">版型／款式</label><input id="shape" name="shape" placeholder="例如：寬鬆版型"></div>
          <div class="form-field"><label for="style">風格</label><select id="style" name="style"><option value="Minimal">極簡</option><option value="Casual">休閒</option><option value="Smart Casual">簡約正式</option><option value="Chic">時髦</option></select></div>
          <div class="form-field"><label for="season">適合季節</label><select id="season" name="season"><option value="Spring / Summer">春夏</option><option value="Autumn / Winter">秋冬</option><option value="All year">四季</option></select></div>
          <div class="form-field full"><label for="notes">備註</label><textarea id="notes" name="notes" placeholder="寫下這件單品的小筆記"></textarea></div>
        </div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelForm">取消</button><button type="submit" class="primary">儲存到衣櫥</button></div>
      </form>
    </section>
  </div>
  <div id="notification-modal-slot"></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>renderHome();</script>
</body>
</html>
