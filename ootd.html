<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · OOTD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=ootd-post">
</head>
<body>
  <main class="shared-ootd-page">
    <a class="shared-ootd-brand" href="profile.html">OOTie</a>
    <section id="sharedOotdState" class="shared-ootd-state">正在載入這篇 OOTD...</section>
    <article id="sharedOotdCard" class="shared-ootd-card" hidden></article>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyC_BjxLgDmCzozqJn4uZBC5JDKYSRWYQ2I',
      authDomain: 'ootie-e8b2c.firebaseapp.com',
      databaseURL: 'https://ootie-e8b2c-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'ootie-e8b2c',
      storageBucket: 'ootie-e8b2c.firebasestorage.app',
      messagingSenderId: '335267284931',
      appId: '1:335267284931:web:ac18674281bb8a47309f76'
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const postId = new URLSearchParams(window.location.search).get('id');
    const state = document.getElementById('sharedOotdState');
    const card = document.getElementById('sharedOotdCard');

    function formatCreatedAt(value) {
      if (!value) return '';
      if (typeof value.toDate === 'function') return value.toDate().toLocaleDateString('zh-TW');
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('zh-TW');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>\"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[character]));
    }

    async function loadSharedPost() {
      if (!postId) throw new Error('missing-id');
      const postsQuery = query(collection(db, 'ootdPosts'), where('id', '==', postId));
      const snapshot = await getDocs(postsQuery);
      if (snapshot.empty) throw new Error('not-found');
      const post = snapshot.docs[0].data();
      const outfitItems = Array.isArray(post.outfitItems) ? post.outfitItems : [];
      card.innerHTML = `<img class="shared-ootd-photo" src="${escapeHtml(post.photoUrl)}" alt="OOTD 穿搭照片"><div class="shared-ootd-content"><p class="eyebrow">OOTD 分享</p><h1>今天的穿搭</h1><p class="shared-ootd-advice">${escapeHtml(post.sizeAdvice || '沒有留下穿搭建議。')}</p><div class="shared-ootd-items"><strong>穿搭單品</strong>${outfitItems.length ? `<ul>${outfitItems.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>尚未標註衣櫥單品。</p>'}</div><p class="shared-ootd-date">發布於 ${formatCreatedAt(post.createdAt)}</p><button type="button" class="primary" id="copySharedLink">複製貼文連結</button></div>`;
      card.hidden = false;
      state.hidden = true;
      document.getElementById('copySharedLink').addEventListener('click', async () => {
        await navigator.clipboard.writeText(window.location.href);
        document.getElementById('copySharedLink').textContent = '連結已複製';
      });
    }

    loadSharedPost().catch(error => {
      state.textContent = error.message === 'missing-id' ? '缺少貼文連結。' : '找不到這篇 OOTD，或目前沒有權限讀取。';
    });
  </script>
</body>
</html>
