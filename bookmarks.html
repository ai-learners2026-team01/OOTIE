<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · 書籤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bookmarks.css">
</head>
<body data-page="bookmarks">
  <div class="app">
    <div id="sidebar-slot"></div>

    <main>
      <div id="topbar-slot"></div>

      <section class="page active" id="bookmarksPage">
        <p class="eyebrow">Bookmarks</p>
        <h1>書籤</h1>
        <p class="intro">把想買或想再看的商品先存起來，等下一次想穿、想買時能直接找到。</p>

        <div class="bookmarks-toolbar">
          <div class="bookmarks-actions">
            <button class="secondary ext-btn" id="openExtensionGuideBtn" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>安裝擴充功能</span>
            </button>
            <button class="secondary" id="toggleBookmarkManager" type="button">管理</button>
            <button class="primary" id="openBookmarkForm" type="button">＋ 建立書籤</button>
          </div>
        </div>

        <div class="bookmark-manager-bar hidden" id="bookmarkManagerBar">
          <span id="bookmarkSelectedCount">已選 0 件</span>
          <button class="danger" id="deleteSelectedBookmarks" type="button" disabled>刪除已選</button>
        </div>

        <div class="bookmarks-grid" id="bookmarksGrid"></div>
      </section>
    </main>
  </div>

  <div id="bottom-nav-slot"></div>

  <!-- 手動優先書籤表單 Modal (橫式大圖配置) -->
  <div class="modal-backdrop" id="bookmarkModal">
    <section class="modal bookmark-form-modal">
      <button class="modal-close" id="closeBookmarkForm" aria-label="關閉">×</button>
      <div class="bookmark-form-layout">
        <!-- 左側：大尺寸預覽卡片 (參考詳細頁面設計) -->
        <div class="bookmark-form-left">
          <div class="bookmark-preview-box" id="bookmarkPreviewBox">
            <div class="preview-placeholder" id="bookmarkPreviewPlaceholder">
              <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>尚未加入商品圖片</span>
              <small>請在右側輸入網址或選取檔案</small>
            </div>
            <img id="bookmarkImagePreview" alt="商品預覽" style="display:none;">
          </div>
        </div>

        <!-- 右側：輸入欄位 -->
        <div class="bookmark-form-right">
          <p class="eyebrow">收藏商品</p>
          <h2 id="bookmarkFormTitle">建立書籤</h2>
          <form id="bookmarkForm">
            <div class="form-grid">
              <div class="form-field full">
                <label for="bookmarkTitle">商品名稱 *</label>
                <input id="bookmarkTitle" required placeholder="例如：The Ilana Cardigan">
              </div>

              <div class="form-field full">
                <label for="bookmarkUrlInput">商品頁網址</label>
                <input id="bookmarkUrlInput" type="url" placeholder="https://example.com/product/...">
              </div>

              <!-- 合併為一個欄位的圖片來源 (網址 + 上傳檔案) -->
              <div class="form-field full">
                <label for="bookmarkImageUrl">商品圖片 (輸入網址或選取檔案)</label>
                <div class="combined-image-field">
                  <input id="bookmarkImageUrl" type="url" placeholder="貼上圖片網址 https://...">
                  <label class="file-upload-badge" for="bookmarkImageUpload" title="從電腦選擇圖片檔案">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>選取檔案</span>
                    <input id="bookmarkImageUpload" type="file" accept="image/*">
                  </label>
                </div>
              </div>
            </div>

            <!-- 補充更多折疊區 -->
            <div class="bookmark-extra-controls">
              <button type="button" class="text-button" id="toggleBookmarkExtras">▾ 補充更多 (品牌、尺寸、價格等)</button>
            </div>

            <div id="bookmarkExtraFields" hidden>
              <div class="form-grid">
                <div class="form-field">
                  <label for="bookmarkBrand">品牌</label>
                  <input id="bookmarkBrand" placeholder="例如：Aritzia">
                </div>

                <div class="form-field">
                  <label for="bookmarkVariantNameDisplay">款式 / 分類</label>
                  <input id="bookmarkVariantNameDisplay" placeholder="例如：Caramel beige / 連帽款">
                </div>

                <div class="form-field">
                  <label for="bookmarkColorDisplay">顏色</label>
                  <input id="bookmarkColorDisplay" placeholder="例如：Beige / 黑色">
                </div>

                <div class="form-field">
                  <label for="bookmarkSizeDisplay">尺寸</label>
                  <input id="bookmarkSizeDisplay" placeholder="例如：M / 38">
                </div>

                <div class="form-field">
                  <label for="bookmarkPrice">價格</label>
                  <input id="bookmarkPrice" placeholder="例如：3990">
                </div>

                <div class="form-field">
                  <label for="bookmarkCurrency">貨幣</label>
                  <select id="bookmarkCurrency">
                    <option value="TWD">TWD</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="JPY">JPY</option>
                  </select>
                </div>

                <div class="form-field full">
                  <label for="bookmarkNotes">備註</label>
                  <input id="bookmarkNotes" type="text" placeholder="例如：想等週末特價再買">
                </div>
              </div>
            </div>

            <div class="form-actions bookmark-submit-actions">
              <button type="button" class="secondary" id="cancelBookmarkForm">取消</button>
              <button type="submit" class="primary" id="saveBookmarkSubmitBtn">儲存書籤</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>

  <!-- 擴充功能介紹與展示 Modal -->
  <div class="modal-backdrop" id="extensionGuideModal">
    <section class="modal extension-guide-modal">
      <button class="modal-close" id="closeExtensionGuide" aria-label="關閉">×</button>
      <p class="eyebrow">Chrome Extension</p>
      <h2>OOTie 穿搭商品收藏助手</h2>
      <p class="guide-intro">在各大購物網站一鍵擷取穿搭單品，自動辨識商品款式、顏色、尺寸與即時售價，無縫收藏至你的 OOTie 書籤！</p>

      <!-- 模擬圖展示區 -->
      <div class="extension-mockup-showcase">
        <img id="extensionMockupImg" src="assets/extension-mockup.png" alt="OOTie 擴充功能操作預覽" onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex';">
        <div class="mockup-placeholder" id="mockupPlaceholder" style="display:none;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <strong>擴充功能操作預覽圖</strong>
          <small>可將生成的預覽圖放至 <code>assets/extension-mockup.png</code></small>
        </div>
      </div>

      <div class="form-actions guide-footer-actions">
        <button type="button" class="primary" id="closeExtensionGuideConfirm">安裝 OOTie 擴充功能</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="bookmarkDetailBackdrop">
    <section class="modal detail-layout bookmark-detail-modal">
      <button class="modal-close" data-close-bookmark-detail aria-label="關閉">×</button>
      <div class="detail-photo">
        <div class="detail-photo-placeholder" id="bookmarkDetailPlaceholder" style="display:none;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>暫無商品圖片</span>
        </div>
        <img id="bookmarkDetailImage" src="" alt="">
      </div>
      <div class="detail-content">
        <p class="eyebrow" id="bookmarkDetailBrand">商品</p>
        <h2 id="bookmarkDetailTitle"></h2>
        <p class="detail-category" id="bookmarkDetailMeta"></p>
        <dl class="detail-fields">
          <div><dt>品牌</dt><dd id="bookmarkDetailBrandValue">—</dd></div>
          <div><dt>價格</dt><dd id="bookmarkDetailPriceValue">—</dd></div>
          <div><dt>尺寸</dt><dd id="bookmarkDetailSizeValue">—</dd></div>
          <div><dt>顏色</dt><dd id="bookmarkDetailColorValue">—</dd></div>
          <div><dt>款式</dt><dd id="bookmarkDetailVariantValue">—</dd></div>
          <div><dt>來源</dt><dd id="bookmarkDetailSourceValue">—</dd></div>
        </dl>
        <p class="detail-notes" id="bookmarkDetailNotes"></p>
        <div class="modal-actions bookmark-detail-actions">
          <button class="secondary" id="bookmarkDetailEditButton" type="button">編輯</button>
          <a class="primary bookmark-link-btn" id="bookmarkProductLink" href="#" target="_blank" rel="noreferrer">
            前往商品頁面
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-left:5px;">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </div>

  <div id="notification-modal-slot"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="bookmarks.js"></script>
</body>
</html>
