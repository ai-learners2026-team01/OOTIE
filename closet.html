<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOTie · 我的衣櫥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="closet">
  <div class="app">
    <div id="sidebar-slot"></div>

    <main>
      <div id="topbar-slot"></div>

      <section class="page active" id="closetPage">
        <p class="eyebrow">數位衣櫥</p>
        <h1>我的衣櫥</h1>
        <p class="intro">把擁有的每一件衣服，準備成下一套日常。</p>
        <div class="toolbar">
          <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="搜尋你的衣櫥" aria-label="搜尋你的衣櫥"></label>
          <select class="select" id="colorFilter" aria-label="依顏色篩選"><option value="">顏色</option><option value="White">白色</option><option value="Black">黑色</option><option value="Blue">藍色</option><option value="Beige">米色</option><option value="Brown">棕色</option></select>
          <select class="select" id="seasonFilter" aria-label="依季節篩選"><option value="">季節</option><option value="Spring / Summer">春夏</option><option value="Autumn / Winter">秋冬</option><option value="All year">四季</option></select>
          <select class="select" id="styleFilter" aria-label="依風格篩選"><option value="">風格</option><option value="Minimal">極簡</option><option value="Casual">休閒</option><option value="Smart Casual">簡約正式</option><option value="Chic">時髦</option></select>
        </div>
        <div class="category-row" id="categoryRow" aria-label="單品分類"></div>
        <div class="closet-meta"><strong id="itemCount">42 件單品</strong><div class="closet-meta-actions"><button class="clear" id="clearFilters">清除篩選</button><button class="add-item-button" id="desktopAdd">＋ 新增單品</button></div></div>
        <div class="grid" id="itemGrid"></div>
      </section>
    </main>
  </div>

  <div id="bottom-nav-slot"></div>

  <div class="modal-backdrop" id="detailBackdrop">
    <article class="modal detail-layout" id="detailModal"></article>
  </div>
  <div class="modal-backdrop" id="formBackdrop">
    <section class="modal form-modal">
      <button class="modal-close" id="closeForm" aria-label="關閉">×</button>
      <p class="eyebrow" id="formEyebrow">新增單品</p>
      <h2 id="formTitle">加入衣櫥</h2>
      <form id="itemForm">
        <div class="form-field full"><label for="photoFile">上傳單品照片</label><label class="upload-zone" for="photoFile"><strong>選擇一張單品照片</strong><span>建議使用單件衣物照片，支援 JPG、PNG、WEBP</span><input id="photoFile" name="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><img class="upload-preview" id="uploadPreview" alt="照片預覽"></label><input id="photo" name="photo" type="hidden"></div>
        <div class="form-grid">
          <div class="form-field"><label for="name">單品名稱</label><input id="name" name="name" required placeholder="例如：亞麻襯衫"></div>
          <div class="form-field"><label for="category">分類</label><select id="category" name="category"><option value="Tops">上衣</option><option value="Bottoms">下身</option><option value="Dress">洋裝</option><option value="Outerwear">外套</option><option value="Shoes">鞋履</option><option value="Bags">包款</option><option value="Accessories">配件</option></select></div>
          <div class="form-field"><label for="brand">品牌</label><input id="brand" name="brand" placeholder="選填"></div>
          <div class="form-field"><label for="primary_color">主要顏色</label><input id="primary_color" name="primary_color" required placeholder="例如：White"></div>
          <div class="form-field"><label for="secondary_color">次要顏色</label><input id="secondary_color" name="secondary_color" placeholder="選填，例如：Beige"></div>
          <div class="form-field"><label for="shape">版型／款式</label><input id="shape" name="shape" placeholder="例如：寬鬆版型"></div>
          <div class="form-field"><label for="style">風格</label><select id="style" name="style"><option value="Minimal">極簡</option><option value="Casual">休閒</option><option value="Smart Casual">簡約正式</option><option value="Chic">時髦</option></select></div>
          <div class="form-field"><label for="season">適合季節</label><select id="season" name="season"><option value="Spring / Summer">春夏</option><option value="Autumn / Winter">秋冬</option><option value="All year">四季</option></select></div>
          <div class="form-field full"><label for="notes">備註</label><textarea id="notes" name="notes" placeholder="寫下這件單品的小筆記"></textarea></div>
        </div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelForm">取消</button><button type="submit" class="primary">儲存到衣櫥</button></div>
      </form>
    </section>
  </div>
  <div id="notification-modal-slot"></div>
  <div class="toast" id="toast"></div>

  <script src="supabase-config.local.js"></script>
  <script src="fixture-data.local.js"></script>
  <script src="supabase-adapter.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>renderCategories(); renderItems();</script>
</body>
</html>
